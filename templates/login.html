{% extends "base.html" %}

{% block content %}
<div class="form-container" style="max-width: 440px;">
  <div style="text-align: center; margin-bottom: 2rem;">
    <h1 style="font-size: 2rem; font-weight: 800; margin-bottom: 0.5rem;">Welcome Back</h1>
    <p style="color: var(--text-muted);">Sign in to access your saved PocketSmart AI budget plans.</p>
  </div>

  {% if error %}
  <div style="background: rgba(239, 68, 68, 0.15); border: 1px solid rgba(239, 68, 68, 0.4); color: #fca5a5; padding: 0.85rem; border-radius: var(--radius-md); margin-bottom: 1.5rem; text-align: center; font-size: 0.95rem;">
    ⚠️ {{ error }}
  </div>
  {% endif %}

  <form action="/login" method="POST" class="glass-card">
    <div class="form-group">
      <label class="form-label" for="username">Username</label>
      <input type="text" id="username" name="username" class="form-control" placeholder="Enter your username" required autofocus>
    </div>

    <div class="form-group">
      <label class="form-label" for="password">Password</label>
      <input type="password" id="password" name="password" class="form-control" placeholder="Enter your password" required>
    </div>

    <button type="submit" class="btn btn-primary btn-block" style="padding: 0.85rem; font-size: 1rem; margin-top: 0.5rem;">
      Login &rarr;
    </button>

    <div style="text-align: center; margin-top: 1.5rem; font-size: 0.9rem; color: var(--text-muted);">
      Don't have an account? <a href="/register" style="color: #a5b4fc; text-decoration: none; font-weight: 600;">Register now</a>
    </div>
  </form>
</div>
{% endblock %}
