{% extends "base.html" %}

{% block content %}
<div class="form-container" style="max-width: 480px;">
  <div style="text-align: center; margin-bottom: 2rem;">
    <h1 style="font-size: 2rem; font-weight: 800; margin-bottom: 0.5rem;">Create Your Account</h1>
    <p style="color: var(--text-muted);">Join PocketSmart AI for personalized budget recommendation tracking across all lifestyle domains.</p>
  </div>

  {% if error %}
  <div style="background: rgba(239, 68, 68, 0.15); border: 1px solid rgba(239, 68, 68, 0.4); color: #fca5a5; padding: 0.85rem; border-radius: var(--radius-md); margin-bottom: 1.5rem; text-align: center; font-size: 0.95rem;">
    ⚠️ {{ error }}
  </div>
  {% endif %}

  <form action="/register" method="POST" class="glass-card">
    <div class="form-group">
      <label class="form-label" for="full_name">Full Name</label>
      <input type="text" id="full_name" name="full_name" class="form-control" placeholder="e.g. Rahul Sharma">
    </div>

    <div class="form-group">
      <label class="form-label" for="username">Username *</label>
      <input type="text" id="username" name="username" class="form-control" placeholder="Choose a unique username" required>
    </div>

    <div class="form-group">
      <label class="form-label" for="email">Email Address *</label>
      <input type="email" id="email" name="email" class="form-control" placeholder="name@example.com" required>
    </div>

    <div class="form-group">
      <label class="form-label" for="password">Password *</label>
      <input type="password" id="password" name="password" class="form-control" placeholder="Create a password" required minlength="4">
    </div>

    <button type="submit" class="btn btn-primary btn-block" style="padding: 0.85rem; font-size: 1rem; margin-top: 0.5rem;">
      Create Account &rarr;
    </button>

    <div style="text-align: center; margin-top: 1.5rem; font-size: 0.9rem; color: var(--text-muted);">
      Already have an account? <a href="/login" style="color: #a5b4fc; text-decoration: none; font-weight: 600;">Log in</a>
    </div>
  </form>
</div>
{% endblock %}
